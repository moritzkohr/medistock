# Local development against the docker compose Postgres.
# Defaults match docker-compose.yml; override via environment variables or .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:medistock}
spring.datasource.username=${POSTGRES_USER:medistock}
spring.datasource.password=${POSTGRES_PASSWORD:medistock}